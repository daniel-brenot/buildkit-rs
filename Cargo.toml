[package]
name = "buildkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Build OCI images from Dockerfiles with a pluggable execution backend"
license = "Apache-2.0"
keywords = ["docker", "dockerfile", "buildkit", "oci", "containers"]
categories = ["development-tools"]

[dependencies]
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
tar = "0.4"
base64 = "0.23.1"
directories = "6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
containerfile = "0.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
